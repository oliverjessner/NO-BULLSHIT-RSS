[package]
name = "no-bullshit-rss"
version = "1.5.0"
description = "Local RSS reader"
authors = ["Oliver Jessner"]
edition = "2021"
rust-version = "1.93"

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = ["unstable", "devtools"] }
tauri-plugin-opener = "=2.7.1"
tauri-plugin-dialog = "=2.8.2"
tauri-plugin-single-instance = "=2.5.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1

# Stripped proc-macro dylibs can have invalid LINKEDIT alignment on macOS 27.
# https://github.com/rust-lang/rust/issues/157750
[profile.release.build-override]
strip = "none"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
